id: io.github.wanglin2.mind-map
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: run.sh
rename-desktop-file: thoughts.desktop
rename-icon: thoughts

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network

modules:
  - name: mind-map
    buildsystem: simple
    build-commands:
      - ar x thoughts.deb
      - tar xf data.tar.xz
      - mv opt/* /app/main
      - mv usr/share/applications usr/share/icons /app/share
      - desktop-file-edit --set-key Exec --set-value "run.sh %U" /app/share/applications/thoughts.desktop
      - mkdir /app/share/metainfo
      - mv /app/main/$FLATPAK_ID.metainfo.xml /app/share/metainfo
      - install -Dm755 -t /app/bin run.sh
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://github.com/wanglin2/mind-map/releases/download/0.20.0/thoughts_0.20.0_amd64.deb
        sha256: fec49f2907742fae0d90d5374626c2097f4ab34729d4acf376db68bdb86728aa
        dest-filename: thoughts.deb
        x-checker-data:
          type: json
          url: https://api.github.com/repos/wanglin2/mind-map/releases/latest
          version-query: .tag_name | sub("^electron-"; "")
          url-query: .assets[] | select(.name=="thoughts_" + $version + "_amd64.deb")
            | .browser_download_url
      - type: file
        only-arches: [aarch64]
        url: https://github.com/wanglin2/mind-map/releases/download/0.20.0/thoughts_0.20.0_arm64.deb
        sha256: 58b290e49b588a43f83fc215dab94b3162f988de744313e59af3e7179a3de48c
        dest-filename: thoughts.deb
        x-checker-data:
          type: json
          url: https://api.github.com/repos/wanglin2/mind-map/releases/latest
          version-query: .tag_name | sub("^electron-"; "")
          url-query: .assets[] | select(.name=="thoughts_" + $version + "_arm64.deb")
            | .browser_download_url
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/thoughts "$@"
